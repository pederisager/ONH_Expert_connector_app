version: search_relevance_pilot_v1
description: >-
  Data-quality-first pilot benchmark with dual intent modes. Publication-grounded
  queries require publication evidence, while profile-grounded queries accept profile
  evidence and treat staffinfo as fallback.
source_snapshot:
  staff_yaml: data/staff.yaml
  summaries_json: data/precomputed_summaries.json
  nva_results: data/nva/results.jsonl
metrics:
  - MustInclude@3
  - ShouldInclude@10
  - HardExcludeRate@10
  - PublicationEvidencePassRate
regression_thresholds:
  must_include_at_3_min: 0.55
  should_include_at_10_min: 0.7
  hard_exclude_rate_at_10_min_min: 0.9
  publication_evidence_pass_rate_min: 0.65
global_rules:
  default_top_k: 10
  default_min_query_term_overlap_per_citation: 1
  require_citation_for_must_include: true
overexposure_controls:
  - staff: Tore Pedersen
    rationale: "Broad profile; should not dominate unrelated topics."
    expected_relevant_query_ids:
      - Q005
    max_queries_in_top_10: 2
    max_queries_in_top_3: 0
queries:
  - id: Q001
    query_text: "ARFID og andre restriktive spiseforstyrrelser hos unge"
    query_mode: publication_grounded
    required_source_kinds: ["nva"]
    citation_overlap_rules:
      min_query_term_overlap_per_citation: 1
    expected:
      must_include: [Camilla Lindvall Dahlgren, Line Wisting]
      should_include: [Lise Eriksen]
      hard_exclude: [Anne Fylling Frøyen, Andreas Østhagen]

  - id: Q002
