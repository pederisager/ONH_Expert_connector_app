metrics:
- MustInclude@3
- ShouldInclude@10
- HardExcludeRate@10
- PublicationEvidencePassRate
regression_thresholds:
  must_include_at_3_min: 0.70
  should_include_at_10_min: 0.80
  hard_exclude_rate_at_10_min_min: 0.97
  publication_evidence_pass_rate_min: 0.70
mode_regression_thresholds:
  publication_grounded:
    must_include_at_3_min: 0.75
    should_include_at_10_min: 0.78
    hard_exclude_rate_at_10_min_min: 0.97
    publication_evidence_pass_rate_min: 0.75
  profile_grounded:
    must_include_at_3_min: 0.65
    should_include_at_10_min: 0.82
    hard_exclude_rate_at_10_min_min: 0.97
global_rules:
  default_top_k: 10
  default_min_query_term_overlap_per_citation: 1
  require_citation_for_must_include: true
overexposure_controls:
