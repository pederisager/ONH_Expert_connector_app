version: search_relevance_100_v1
description: Expanded 100-query benchmark with domain, intent, and difficulty quotas.
  Queries are Norwegian-first and grounded in ONH tags plus NVA topic language.
source_snapshot:
  staff_yaml: data/staff.yaml
  summaries_json: data/precomputed_summaries.json
  nva_results: data/nva/results.jsonl
  candidate_pool: reports/benchmark_query_candidates_150.json
coverage_matrix:
  target:
    domains:
      Psykologi: 25
      Helsefag: 25
      Statsvitenskap og internasjonale relasjoner: 25
      Økonomi og administrasjon: 25
    intent_mix:
      publication_grounded: 60
      profile_grounded: 40
    difficulty_mix:
      easy: 35
      medium: 35
      hard: 20
      negative: 10
  actual:
    domains:
      Psykologi: 25
      Helsefag: 25
      Statsvitenskap og internasjonale relasjoner: 25
      Økonomi og administrasjon: 25
    intent_mix:
      publication_grounded: 60
      profile_grounded: 40
    difficulty_mix:
      easy: 35
      medium: 35
      hard: 20
      negative: 10
labeling_protocol:
  must_include: Expected in top3 for pass.
  should_include: Expected in top10 where evidence aligns.
  hard_exclude: Should not appear in top10.
  publication_grounded_rule: Requires nva/doi citation with token overlap.
